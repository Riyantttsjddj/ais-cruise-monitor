# SEMENTARA — uji A/B. Akan dihapus setelah menjawab satu pertanyaan:
# apakah `2-57/5 * * * *` di poll.yml yang tidak diterima penjadwal GitHub,
# atau penjadwalnya sendiri yang tidak jalan di repo ini.
#
# Bedanya cuma satu: di sini `*/5` — bentuk yang persis dipakai contoh
# dokumentasi GitHub. Kalau yang ini menyala sementara poll.yml tidak, maka
# ekspresi poll.yml yang salah. Kalau dua-duanya diam, masalahnya bukan di
# ekspresi.
name: ujicron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  uji:
    runs-on: ubuntu-latest
    steps:
      - run: echo "cron */5 menyala"
