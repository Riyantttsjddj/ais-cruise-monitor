<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>Akses Terbatas — Stasiun Pelacakan Kapal</title>
<!--
  Halaman kunci. SENGAJA berdiri sendiri: tidak ada satu pun permintaan ke luar
  (font, ikon, skrip, atau gaya dari CDN). Alasannya bukan kerapian — halaman
  ini adalah satu-satunya yang boleh diakses sebelum kodenya dimasukkan, jadi
  kalau ia bergantung pada pihak ketiga, situsnya ikut mati saat pihak ketiga
  itu bermasalah. Seluruh efek di sini (radar, garis pindai, tabung CRT) dibuat
  dari gradien CSS, bukan gambar.

  Warnanya disalin dari :root di index.html. Disalin, bukan diimpor, justru
  supaya tidak ada ketergantungan ke berkas halaman yang sedang dikunci — dan
  supaya perpindahan ke peta tidak terasa seperti berpindah situs.
-->
<style>
  :root{
    --bg:#070d16;
    --panel-solid:#0c1421;
    --line:rgba(120,170,220,.16);
    --ink:#e8f2ff;
    --ink-dim:#8aa4c0;
    --accent:#3ddc97;
    --accent-2:#38bdf8;
    --bad:#f87171;
    --warn:#fbbf24;
    --radius:14px;
    --shadow:0 18px 44px rgba(0,0,0,.55);
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
    padding:24px;overflow:hidden;
  }

  /* ---------------------------------------------------------- latar */
  .latar{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}

  /* Radar: cincin konsentris, dan sapuannya lapisan TERPISAH. Kalau keduanya
     satu `background`, mematikan geraknya untuk `prefers-reduced-motion`
     meninggalkan potongan kue yang membeku di layar — terlihat seperti
     kerusakan, bukan seperti hiasan yang dimatikan. */
  .radar,.sapuan{
    position:absolute;left:50%;top:50%;
    width:min(160vmin,1400px);aspect-ratio:1;transform:translate(-50%,-50%);
    border-radius:50%;
    -webkit-mask-image:radial-gradient(circle at 50% 50%,#000 0 46%,transparent 68%);
            mask-image:radial-gradient(circle at 50% 50%,#000 0 46%,transparent 68%);
  }
  .radar{
    background:repeating-radial-gradient(circle at 50% 50%,
      rgba(61,220,151,.085) 0 1px, transparent 1px 7.5%);
  }
  .sapuan{
    background:conic-gradient(from 0deg,
      rgba(61,220,151,.20) 0deg, rgba(61,220,151,.06) 26deg,
      transparent 52deg, transparent 360deg);
    animation:putar 8s linear infinite;
  }
  /* Garis bidik, diam — memberi kesan instrumen, bukan hiasan. */
  .bidik{
    position:absolute;left:50%;top:50%;width:min(160vmin,1400px);aspect-ratio:1;
    transform:translate(-50%,-50%);
    background:
      linear-gradient(to right,transparent calc(50% - .5px),rgba(56,189,248,.14) 50%,transparent calc(50% + .5px)),
      linear-gradient(to bottom,transparent calc(50% - .5px),rgba(56,189,248,.14) 50%,transparent calc(50% + .5px));
    -webkit-mask-image:radial-gradient(circle at 50% 50%,#000 0 40%,transparent 60%);
            mask-image:radial-gradient(circle at 50% 50%,#000 0 40%,transparent 60%);
  }
  /* Garis pindai yang turun pelan, seperti tabung CRT. */
  .pindai{
    position:absolute;left:0;right:0;height:38vh;top:-38vh;
    background:linear-gradient(to bottom,transparent,rgba(61,220,151,.055) 60%,rgba(61,220,151,.12));
    animation:turun 9s linear infinite;
  }
  /* Butir halus + vignette: menahan mata di tengah dan menghapus tepi layar. */
  .butir{
    position:absolute;inset:0;
    background:
      repeating-linear-gradient(to bottom,
        rgba(255,255,255,.022) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at 50% 45%,transparent 30%,rgba(0,0,0,.55) 100%);
  }

  /* ---------------------------------------------------------- kartu */
  .terminal{
    position:relative;z-index:1;
    width:100%;max-width:430px;
    background:linear-gradient(180deg,rgba(12,20,33,.94),rgba(9,15,26,.97));
    border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow),0 0 0 1px rgba(61,220,151,.05),0 0 60px -18px rgba(61,220,151,.35);
    padding:22px 24px 16px;
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
    transition:border-color .25s,box-shadow .25s;
  }
  /* Sudut siku — aksen kecil yang membuat bingkai terasa seperti perangkat. */
  .terminal::before,.terminal::after{
    content:"";position:absolute;width:14px;height:14px;pointer-events:none;
    border-color:var(--accent);opacity:.5;transition:opacity .25s,border-color .25s;
  }
  .terminal::before{top:-1px;left:-1px;border-top:2px solid;border-left:2px solid;border-top-left-radius:var(--radius)}
  .terminal::after{bottom:-1px;right:-1px;border-bottom:2px solid;border-right:2px solid;border-bottom-right-radius:var(--radius)}

  .kop{
    display:flex;align-items:center;gap:7px;
    font:600 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-dim);
  }
  .kop .titik{
    width:6px;height:6px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 8px var(--accent);animation:denyut 2.4s ease-in-out infinite;
  }
  h1{
    margin:14px 0 4px;font:700 27px/1.1 var(--mono);
    letter-spacing:.06em;text-transform:uppercase;color:var(--ink);
  }
  .bantu{margin:0 0 16px;color:var(--ink-dim);font-size:12.5px}

  /* ------------------------------------------------- log boot */
  /* Tingginya DISIAGAKAN untuk tiga baris, tapi tidak DIPAKU. `height` tetap
     akan memotong baris yang membungkus di layar sempit — teks yang terpangkas
     separuh jauh lebih buruk daripada kartu yang bergeser satu baris. Dengan
     `min-height`, kotak berhenti tumbuh justru karena isinya memang sudah
     pas tiga baris. */
  .boot{
    margin:0 0 16px;padding:10px 12px;
    min-height:calc(3 * 1.75em + 22px);
    background:rgba(4,9,16,.72);border:1px solid var(--line);border-radius:9px;
    font:11.5px/1.75 var(--mono);color:var(--ink-dim);
    white-space:pre-wrap;word-break:break-word;overflow:hidden;
  }
  .boot b{color:var(--accent);font-weight:600}
  .boot .kursor{
    display:inline-block;width:7px;height:12px;vertical-align:-2px;
    background:var(--accent);animation:kedip 1.05s steps(1) infinite;
  }

  /* ------------------------------------------------- kotak digit */
  fieldset.kode{
    margin:0;padding:0;border:0;
    display:grid;grid-template-columns:repeat(6,1fr);gap:9px;
  }
  fieldset.kode legend{
    position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);
    white-space:nowrap;
  }
  .digit{
    width:100%;min-width:0;aspect-ratio:5/6;
    background:rgba(4,9,16,.85);color:var(--ink);
    border:1px solid var(--line);border-radius:10px;
    font:600 25px/1 var(--mono);text-align:center;
    caret-color:var(--accent);outline:none;padding:0;
    transition:border-color .15s,box-shadow .15s,background .15s,transform .12s;
    -moz-appearance:textfield;
  }
  .digit::-webkit-outer-spin-button,
  .digit::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .digit:hover{border-color:rgba(120,170,220,.3)}
  .digit:focus{
    border-color:var(--accent);background:rgba(6,14,24,.95);
    box-shadow:0 0 0 3px rgba(61,220,151,.14),0 0 18px -6px var(--accent);
    transform:translateY(-1px);
  }
  /* Terisi: angkanya menyala, jadi mata bisa memeriksa sebelum menekan Buka. */
  .digit.isi{color:var(--accent);border-color:rgba(61,220,151,.42)}
  fieldset.kode.salah .digit{
    border-color:var(--bad);color:var(--bad);
    box-shadow:0 0 0 3px rgba(248,113,113,.13);
  }
  fieldset.kode.salah{animation:getar .42s cubic-bezier(.36,.07,.19,.97)}

  /* ------------------------------------------------- tombol */
  button.buka{
    width:100%;margin-top:16px;padding:13px;
    display:flex;align-items:center;justify-content:center;gap:9px;
    border:1px solid rgba(61,220,151,.55);border-radius:10px;
    background:linear-gradient(180deg,rgba(61,220,151,.16),rgba(61,220,151,.07));
    color:var(--accent);font:700 12.5px/1 var(--mono);
    letter-spacing:.14em;text-transform:uppercase;cursor:pointer;
    transition:background .16s,box-shadow .16s,transform .06s,opacity .16s;
  }
  button.buka:hover{
    background:linear-gradient(180deg,rgba(61,220,151,.26),rgba(61,220,151,.12));
    box-shadow:0 0 26px -8px var(--accent);
  }
  button.buka:active{transform:translateY(1px)}
  button.buka[disabled]{opacity:.45;cursor:default;box-shadow:none}
  button.buka .tanda{font-size:14px;line-height:1}

  /* ------------------------------------------------- pesan status */
  .pesan{
    margin-top:12px;min-height:34px;
    font:12px/1.45 var(--mono);
    display:flex;align-items:center;gap:7px;
  }
  .pesan:empty{visibility:hidden}
  .pesan::before{content:">";color:var(--ink-dim);flex:none}
  .pesan.info{color:var(--ink-dim)}
  .pesan.ingat{color:var(--warn)}
  .pesan.galat{color:var(--bad)}
  .pesan.terbuka{color:var(--accent)}

  /* ------------------------------------------------- kaki */
  .kaki{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-top:14px;padding-top:11px;border-top:1px solid var(--line);
    font:10.5px/1 var(--mono);letter-spacing:.08em;color:var(--ink-dim);
    text-transform:uppercase;
  }
  .nyala{display:flex;align-items:center;gap:6px}
  .nyala i{width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 7px var(--accent)}

  /* ------------------------------------------------- keadaan */
  /* Terkunci salah: seluruh bingkai ikut memerah, bukan cuma teksnya. */
  body.galat .terminal{border-color:rgba(248,113,113,.45);box-shadow:var(--shadow),0 0 60px -18px var(--bad)}
  body.galat .terminal::before,body.galat .terminal::after{border-color:var(--bad);opacity:.85}
  body.terbuka .terminal{border-color:rgba(61,220,151,.6);box-shadow:var(--shadow),0 0 80px -14px var(--accent)}
  body.terbuka .terminal::before,body.terbuka .terminal::after{border-color:var(--accent);opacity:1}

  @keyframes putar{to{transform:translate(-50%,-50%) rotate(360deg)}}
  @keyframes turun{to{top:100vh}}
  @keyframes kedip{50%{opacity:0}}
  @keyframes denyut{50%{opacity:.35}}
  @keyframes getar{
    10%,90%{transform:translateX(-2px)}
    20%,80%{transform:translateX(4px)}
    30%,50%,70%{transform:translateX(-7px)}
    40%,60%{transform:translateX(7px)}
  }

  @media (max-width:400px){
    h1{font-size:22px}
    .digit{font-size:21px;border-radius:8px}
    fieldset.kode{gap:6px}
    .terminal{padding:18px 16px 14px}
    /* Barisnya harus tetap muat satu baris: yang membungkus menambah tinggi
       dan menggeser seluruh kartu. */
    .boot{font-size:10.5px}
  }
  /* Kurang tinggi (mis. ponsel mendatar): buang hiasan, sisakan yang dipakai. */
  @media (max-height:560px){
    .boot{display:none}
    .latar{opacity:.5}
  }

  /* Semua gerak di halaman ini hiasan. Yang memintanya berhenti, berhenti. */
  @media (prefers-reduced-motion:reduce){
    .sapuan,.pindai,.kop .titik,.boot .kursor,
    fieldset.kode.salah{animation:none}
    .sapuan,.pindai{display:none}
    .boot .kursor{opacity:1}
    *{transition-duration:.01ms !important}
  }
</style>
</head>
<body>
  <div class="latar" aria-hidden="true">
    <div class="radar"></div>
    <div class="sapuan"></div>
    <div class="bidik"></div>
    <div class="pindai"></div>
    <div class="butir"></div>
  </div>

  <main class="terminal">
    <div class="kop"><span class="titik"></span> Stasiun Pelacakan Kapal</div>

    <h1>Akses Terbatas</h1>
    <p class="bantu">Masukkan kode 6 digit untuk membuka peta pelacakan.</p>

    <pre class="boot" id="boot" aria-hidden="true"></pre>

    <form id="form" autocomplete="off" novalidate>
      <fieldset class="kode" id="kode">
        <legend>Kode akses, 6 digit</legend>
        <!-- Enam kotak sungguhan, bukan satu kolom yang dipotong-potong CSS.
             Masing-masing punya label sendiri supaya pembaca layar tetap bisa
             menyebut posisinya. -->
        <input class="digit" type="text" inputmode="numeric" pattern="[0-9]*"
               maxlength="1" autocomplete="one-time-code" aria-label="Digit 1">
        <input class="digit" type="text" inputmode="numeric" pattern="[0-9]*"
               maxlength="1" aria-label="Digit 2">
        <input class="digit" type="text" inputmode="numeric" pattern="[0-9]*"
               maxlength="1" aria-label="Digit 3">
        <input class="digit" type="text" inputmode="numeric" pattern="[0-9]*"
               maxlength="1" aria-label="Digit 4">
        <input class="digit" type="text" inputmode="numeric" pattern="[0-9]*"
               maxlength="1" aria-label="Digit 5">
        <input class="digit" type="text" inputmode="numeric" pattern="[0-9]*"
               maxlength="1" aria-label="Digit 6">
      </fieldset>

      <button class="buka" id="buka" type="submit">
        <span class="tanda">▸</span> Buka Akses
      </button>

      <div class="pesan" id="pesan" role="status" aria-live="polite"></div>
    </form>

    <div class="kaki">
      <span class="nyala"><i></i> Terhubung</span>
      <span id="jam">--:--:-- UTC</span>
    </div>
  </main>

<script>
(function () {
  "use strict";

  var form  = document.getElementById("form");
  var grup  = document.getElementById("kode");
  var butir = grup.querySelectorAll(".digit");
  var buka  = document.getElementById("buka");
  var pesan = document.getElementById("pesan");
  var jam   = document.getElementById("jam");
  var boot  = document.getElementById("boot");
  var N     = butir.length;
  var sedang = false;

  function kode() {
    var s = "";
    for (var i = 0; i < N; i++) s += butir[i].value;
    return s;
  }

  function tulis(teks, kelas) {
    pesan.textContent = teks || "";
    pesan.className = "pesan" + (kelas ? " " + kelas : "");
    document.body.classList.toggle("galat", kelas === "galat");
  }

  function bersihkan() {
    for (var i = 0; i < N; i++) { butir[i].value = ""; butir[i].classList.remove("isi"); }
    dokumenter();
    grup.classList.remove("salah");
    butir[0].focus();
  }

  function dokumenter() {
    for (var i = 0; i < N; i++) butir[i].classList.toggle("isi", butir[i].value !== "");
  }

  // Hanya angka. Menyaring di sini, bukan di `maxlength` saja, karena
  // `maxlength` tidak menahan huruf — dan kode yang mengandung huruf dijamin
  // ditolak server, jadi lebih baik tidak pernah terbentuk.
  function angka(s) { return String(s == null ? "" : s).replace(/[^0-9]/g, ""); }

  function fokusKe(i) {
    if (i >= 0 && i < N) { butir[i].focus(); butir[i].select(); }
  }

  // ---------------------------------------------------------- 1. jam
  // Jam UTC sungguhan, bukan angka berjalan yang dikarang. Detiknya sengaja
  // ikut: itulah yang membuat terminal terasa hidup.
  function jamnya() {
    var d = new Date();
    var p = function (n) { return (n < 10 ? "0" : "") + n; };
    jam.textContent = p(d.getUTCHours()) + ":" + p(d.getUTCMinutes()) + ":" +
                      p(d.getUTCSeconds()) + " UTC";
  }
  jamnya();
  setInterval(jamnya, 1000);

  // ---------------------------------------------------------- 2. log boot
  // Hiasan saja — formulirnya sudah bisa dipakai sejak detik pertama. Menahan
  // input demi animasi pembuka itu ide yang buruk: yang sudah tahu kodenya
  // hanya dibuat menunggu.
  //
  // Tiap baris dipecah {a, b, c}: `b` adalah bagian yang menyala, dan bagian
  // itu baru diberi tag setelah barisnya selesai diketik. Menyisipkan tag ke
  // tengah teks yang sedang dipotong per karakter akan mencetak "<b>akti" apa
  // adanya di layar.
  var BARIS = [
    { a: "menghubungkan ke stasiun…" },
    { a: "kanal terenkripsi ", b: "aktif" }
  ];
  var diam = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function esc(s) {
    return String(s).replace(/[&<>]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c];
    });
  }
  function polos(l) { return l.a + (l.b || "") + (l.c || ""); }
  function berwarna(l) {
    return esc(l.a) + (l.b ? "<b>" + esc(l.b) + "</b>" : "") + esc(l.c || "");
  }

  function bootSelesai() {
    boot.innerHTML = BARIS.map(berwarna).join("\n") + "\n<b>menunggu kode</b>";
  }

  if (diam) {
    bootSelesai();
  } else {
    var selesai = [], iBaris = 0, nChar = 0;

    var gambar = function () {
      var html = selesai.join("\n");
      if (iBaris < BARIS.length) {
        // `selesai` kosong hanya di baris pertama, dan baris kosong di awal
        // akan tampak seperti kotak yang belum jadi — jadi pemisahnya baru
        // ditambahkan kalau memang sudah ada isinya.
        html += (html ? "\n" : "") + esc(polos(BARIS[iBaris]).slice(0, nChar));
      } else {
        html += "\n<b>menunggu kode</b> ";
      }
      boot.innerHTML = html + "<span class='kursor'></span>";
    };

    (function langkah() {
      if (iBaris >= BARIS.length) return gambar();
      var penuh = polos(BARIS[iBaris]);
      if (nChar < penuh.length) {
        nChar++;
        gambar();
        setTimeout(langkah, 12);
        return;
      }
      // Baris selesai: barulah potongannya diganti versi bertag.
      selesai.push(berwarna(BARIS[iBaris]));
      iBaris++;
      nChar = 0;
      gambar();
      setTimeout(langkah, 120);
    })();
  }

  // ---------------------------------------------------------- 3. kotak digit
  for (var i = 0; i < N; i++) {
    (function (i) {
      var el = butir[i];

      el.addEventListener("input", function () {
        var a = angka(el.value);
        // Sebagian peramban mengisi seluruh kode sekaligus (isi otomatis SMS,
        // atau papan klip ponsel) walau `maxlength` 1 — kalau hanya digit
        // terakhir yang diambil, kodenya rusak tanpa pesan apa pun.
        if (a.length > 1) {
          el.value = a.charAt(0);
          // `a.slice(1)`, bukan `a`: karakter pertama sudah masuk ke kotak ini,
          // dan menyalinnya lagi membuat seluruh kode bergeser satu kotak.
          isiDari(a.slice(1), i + 1);
        } else {
          el.value = a;
        }
        dokumenter();
        grup.classList.remove("salah");

        if (el.value && i < N - 1) fokusKe(i + 1);
        // Begitu kotak terakhir terisi, langsung kirim. Ini yang membuat
        // halamannya terasa seperti terminal, bukan seperti formulir.
        if (kode().length === N) kirim();
      });

      el.addEventListener("keydown", function (ev) {
        if (ev.key === "Backspace") {
          if (el.value) { el.value = ""; dokumenter(); ev.preventDefault(); return; }
          // Kotak kosong: mundur satu dan hapus isinya, seperti orang mengharapkan.
          if (i > 0) { ev.preventDefault(); butir[i - 1].value = ""; dokumenter(); fokusKe(i - 1); }
          return;
        }
        if (ev.key === "ArrowLeft" && i > 0)  { ev.preventDefault(); fokusKe(i - 1); }
        if (ev.key === "ArrowRight" && i < N - 1) { ev.preventDefault(); fokusKe(i + 1); }
        if (ev.key === "Enter") { ev.preventDefault(); kirim(); }
      });

      el.addEventListener("focus", function () { el.select(); });

      el.addEventListener("paste", function (ev) {
        ev.preventDefault();
        var teks = (ev.clipboardData || window.clipboardData);
        var a = angka(teks ? teks.getData("text") : "");
        if (!a) return;
        // Ditempel dari kotak mana pun, kodenya selalu mengisi dari awal.
        // Mengisi dari kotak yang sedang aktif menghasilkan kode yang salah
        // separuh waktu, dan pengguna tidak punya cara tahu kenapa.
        isiDari(a, 0);
      });
    })(i);
  }

  function isiDari(teks, mulai) {
    for (var j = 0; j < teks.length && mulai + j < N; j++) butir[mulai + j].value = teks.charAt(j);
    dokumenter();
    var akhir = Math.min(mulai + teks.length, N - 1);
    fokusKe(akhir);
    if (kode().length === N) kirim();
  }

  // ---------------------------------------------------------- 4. kirim
  function kirim() {
    if (sedang) return;                       // dua kali tekan = satu permintaan
    var isi = kode();
    if (!isi) { tulis("Kodenya masih kosong."); fokusKe(0); return; }
    if (isi.length < N) { tulis("Kodenya kurang " + (N - isi.length) + " digit."); return; }

    sedang = true;
    buka.disabled = true;
    tulis("memverifikasi…", "info");

    // Kodenya dikirim di BODY, bukan di query string: query string ikut
    // tercatat di log akses Vercel dan mampir ke riwayat peramban.
    fetch("/api/buka", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ kode: isi }),
      credentials: "same-origin"
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        return { status: r.status, data: d };
      });
    }).then(function (hasil) {
      if (hasil.status === 200 && hasil.data && hasil.data.ok) {
        document.body.classList.add("terbuka");
        tulis("akses diterima — membuka peta…", "terbuka");
        buka.disabled = true;
        // replace, bukan href: halaman kunci tidak perlu ikut menumpuk di
        // riwayat, supaya tombol "kembali" tidak memantul ke sini lagi.
        setTimeout(function () { location.replace("/"); }, diam ? 0 : 550);
        return;
      }
      sedang = false;
      buka.disabled = false;
      if (hasil.status === 429) {
        bersihkan();
        tulis("terlalu banyak percobaan — tunggu sebentar", "ingat");
      } else if (hasil.status === 500) {
        // Sebabnya hampir selalu env yang belum diatur di Vercel. Pesannya
        // datang dari server dan sengaja ditampilkan apa adanya, karena kalau
        // disembunyikan gejalanya cuma "kode yang benar ditolak".
        tulis(hasil.data && hasil.data.error
          ? hasil.data.error
          : "server belum siap — periksa Environment Variables", "ingat");
      } else {
        // URUTANNYA PENTING. `bersihkan()` menghapus kelas `salah`, jadi
        // menambahkannya lebih dulu membuat getarannya ditambahkan lalu dicabut
        // di dalam tugas yang sama — animasinya tidak pernah diputar sekali pun.
        bersihkan();
        // Peramban baru menghitung ulang gaya saat ada yang membacanya. Tanpa
        // baris ini, "hapus lalu pasang lagi" dalam satu tarikan napas dianggap
        // tidak ada perubahan, dan kode salah yang kedua kali tidak bergetar.
        void grup.offsetWidth;
        grup.classList.add("salah");
        tulis("akses ditolak — kode salah", "galat");
      }
    }).catch(function () {
      sedang = false;
      buka.disabled = false;
      tulis("tidak bisa menghubungi server — periksa koneksi", "ingat");
    });
  }

  form.addEventListener("submit", function (ev) { ev.preventDefault(); kirim(); });

  // Fokus eksplisit, TIDAK hanya mengandalkan atribut. Sebagian peramban
  // (terutama peramban dalam aplikasi, dan saat halaman dipulihkan dari cache)
  // mengabaikannya, dan pengguna lalu harus menyentuh kolomnya dulu.
  butir[0].focus();
})();
</script>
