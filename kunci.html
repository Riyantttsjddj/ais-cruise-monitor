<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>🔒 Kode Akses — Lacak Kapal</title>
<!--
  Halaman kunci. SENGAJA berdiri sendiri: tidak ada satu pun permintaan ke luar
  (font, ikon, skrip, atau gaya dari CDN). Alasannya bukan kerapian — halaman
  ini adalah satu-satunya yang boleh diakses sebelum kodenya dimasukkan, jadi
  kalau ia bergantung pada pihak ketiga, situsnya ikut mati saat pihak ketiga
  itu bermasalah.

  Warnanya disalin dari :root di index.html. Disalin, bukan diimpor, justru
  supaya tidak ada ketergantungan ke berkas halaman yang sedang dikunci.
-->
<style>
  :root{
    --bg:#070d16;
    --panel-solid:#0c1421;
    --line:rgba(120,170,220,.16);
    --ink:#e8f2ff;
    --ink-dim:#8aa4c0;
    --accent:#3ddc97;
    --bad:#f87171;
    --warn:#fbbf24;
    --radius:14px;
    --shadow:0 18px 44px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--ink);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;padding:24px;
    /* Latar bernuansa sama dengan peta, supaya perpindahan ke halaman utama
       tidak terasa seperti berpindah situs. */
    background-image:radial-gradient(circle at 50% 0%,#0e1a2c 0%,var(--bg) 62%);
  }
  .kartu{
    width:100%;max-width:360px;background:var(--panel-solid);
    border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:28px 24px 24px;text-align:center;
  }
  .ikon{font-size:34px;line-height:1;margin-bottom:14px}
  h1{margin:0 0 6px;font-size:17px;font-weight:600;letter-spacing:.2px}
  p.bantu{margin:0 0 22px;color:var(--ink-dim);font-size:12.5px}
  label{display:block;text-align:left;font-size:12px;color:var(--ink-dim);margin-bottom:7px}
  .baris{position:relative;display:flex;gap:8px}
  input{
    flex:1;min-width:0;background:#0a1220;color:var(--ink);
    border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;font-size:18px;letter-spacing:5px;text-align:center;
    font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    outline:none;transition:border-color .15s;
  }
  input:focus{border-color:var(--accent)}
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .lihat{
    background:#0a1220;border:1px solid var(--line);border-radius:10px;
    color:var(--ink-dim);cursor:pointer;padding:0 12px;font-size:15px;
  }
  .lihat:hover{color:var(--ink)}
  button.buka{
    width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;
    background:var(--accent);color:#04241a;font-size:14px;font-weight:700;
    cursor:pointer;transition:opacity .15s;
  }
  button.buka:hover{opacity:.9}
  button.buka[disabled]{opacity:.45;cursor:default}
  .pesan{
    margin-top:14px;min-height:18px;font-size:12.5px;color:var(--bad);
  }
  .pesan.info{color:var(--ink-dim)}
  .pesan.ingat{color:var(--warn)}
</style>
</head>
<body>
  <form class="kartu" id="form" autocomplete="off">
    <div class="ikon">⚓</div>
    <h1>Kode Akses</h1>
    <p class="bantu">Masukkan kode untuk membuka peta pelacakan kapal.</p>

    <label for="kode">Kode</label>
    <div class="baris">
      <input id="kode" name="kode" type="password" inputmode="numeric"
             autocomplete="off" autocapitalize="off" autocorrect="off"
             spellcheck="false" maxlength="32" autofocus aria-describedby="pesan">
      <button class="lihat" id="lihat" type="button" aria-label="Tampilkan kode">👁</button>
    </div>

    <button class="buka" id="buka" type="submit">Buka</button>
    <div class="pesan" id="pesan" role="status" aria-live="polite"></div>
  </form>

<script>
(function () {
  var form = document.getElementById("form");
  var kode = document.getElementById("kode");
  var buka = document.getElementById("buka");
  var pesan = document.getElementById("pesan");
  var lihat = document.getElementById("lihat");
  var sedang = false;

  // Fokus eksplisit, TIDAK hanya mengandalkan atribut `autofocus` di atas.
  // Sebagian peramban (terutama peramban dalam aplikasi dan saat halaman
  // dipulihkan dari cache) mengabaikan atribut itu, dan pengguna lalu harus
  // menyentuh kolomnya dulu sebelum bisa mengetik.
  kode.focus();

  function tulis(teks, kelas) {
    pesan.textContent = teks || "";
    pesan.className = "pesan" + (kelas ? " " + kelas : "");
  }

  lihat.addEventListener("click", function () {
    var tampil = kode.type === "text";
    kode.type = tampil ? "password" : "text";
    lihat.setAttribute("aria-label", tampil ? "Tampilkan kode" : "Sembunyikan kode");
    kode.focus();
  });

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (sedang) return;

    var isi = kode.value.trim();
    if (!isi) { tulis("Kodenya masih kosong."); kode.focus(); return; }

    sedang = true;
    buka.disabled = true;
    tulis("Memeriksa…", "info");

    // Kodenya dikirim di BODY, bukan di query string: query string ikut
    // tercatat di log akses Vercel dan mampir ke riwayat peramban.
    fetch("/api/buka", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ kode: isi }),
      // Cookie sesi tidak perlu dikirim, tapi juga tidak ada ruginya.
      credentials: "same-origin"
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        return { status: r.status, data: d };
      });
    }).then(function (hasil) {
      if (hasil.status === 200 && hasil.data && hasil.data.ok) {
        tulis("Terbuka. Mengalihkan…", "info");
        // replace, bukan href: halaman kunci tidak perlu ikut menumpuk di
        // riwayat, supaya tombol "kembali" tidak memantul ke sini lagi.
        location.replace("/");
        return;
      }
      sedang = false;
      buka.disabled = false;
      kode.value = "";
      kode.focus();

      if (hasil.status === 429) {
        tulis("Terlalu banyak percobaan. Tunggu sebentar, lalu coba lagi.", "ingat");
      } else if (hasil.status === 500) {
        // Sebabnya hampir selalu env yang belum diatur di Vercel. Pesannya
        // datang dari server dan sengaja ditampilkan apa adanya, karena kalau
        // disembunyikan gejalanya cuma "kode yang benar ditolak".
        tulis(hasil.data && hasil.data.error
          ? hasil.data.error
          : "Server belum siap. Periksa Environment Variables di Vercel.", "ingat");
      } else {
        tulis("Kode salah.");
      }
    }).catch(function () {
      sedang = false;
      buka.disabled = false;
      tulis("Tidak bisa menghubungi server. Periksa koneksi, lalu coba lagi.", "ingat");
    });
  });
})();
</script>
</body>
</html>
